<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAILWIND CSS · PRACTICE 01</title>
    <link href="./dist/output.css" rel="stylesheet" />
  </head>
  <body class="bg-black/90">
    <main class="mx-auto min-h-screen w-full max-w-300 px-10">
      <section class="space-y-10 py-40">
        <div class="flex-col gap-4">
          <span class="text-sm font-bold tracking-[3px] text-red-500"
            >TAILWIND CSS · PRACTICE 01</span
          >
          <h1 class="text-4xl font-bold text-white">Movie Card</h1>
          <p class="text-gray-300">
            이미지, 오버레이, absolute positioning, group-hover, transition을
            활용해 스트리밍 서비스 스타일의 콘텐츠 카드를 만들어봅니다.
          </p>
        </div>

        <article
          id="card"
          class="group/card flex-col-between relative aspect-9/12 max-h-130 rounded-lg bg-[linear-gradient(rgba(0,0,0,0),rgba(0,0,0,1)),url('https://i.namu.wiki/i/pllV4gMlOsxdBXqI2yTjvS2RwY6KtmydQ0cEp97PqcDQSS_sBDtTBd7a_EQ_iljKxhmY-OSCixS3fMnXCjdC_Q.webp')] bg-cover bg-center bg-no-repeat p-4"
        >
          <div
            id="overlay"
            class="flex-center absolute inset-0 opacity-0 transition-opacity duration-500 ease-in-out group-hover/card:opacity-100"
          >
            <button
              type="button"
              class="hover:bg-blue flex h-16 w-16 cursor-pointer items-center justify-center rounded-full bg-white shadow-lg hover:bg-blue-200"
            >
              <span
                class="ml-1 h-0 w-0 border-t-9 border-b-9 border-l-16 border-t-transparent border-b-transparent border-l-black"
              ></span>
            </button>

            <div class="absolute bottom-3 flex w-full gap-2 px-3">
              <button
                type="button"
                class="flex-1 cursor-pointer rounded-md bg-white font-semibold hover:bg-blue-200"
              >
                <span
                  class="inline-block h-0 w-0 border-y-5 border-l-10 border-y-transparent border-l-current"
                ></span>
                재생
              </button>
              <button
                type="button"
                class="flex-center size-10 cursor-pointer rounded-full border border-white"
                aria-label="영상 추가"
              >
                <span class="absolute h-3 w-0.5 bg-white"></span>
                <span class="absolute h-0.5 w-3 bg-white"></span>
              </button>
            </div>
          </div>

          <div class="space-x-0.5 text-sm text-white">
            <span
              class="inline-block rounded-md bg-red-500 px-2.5 py-0.5 font-bold"
              >TOP 10</span
            >
            <span
              class="inline-block rounded-md bg-black px-2.5 py-0.5 font-semibold"
              >19+</span
            >
          </div>

          <div
            class="space-y-2 transition-transform duration-500 ease-in-out group-hover/card:-translate-y-12"
          >
            <span
              class="inline-block text-sm font-bold tracking-widest text-red-400"
              >ORIGINAL SERIES</span
            >
            <p class="text-3xl font-bold text-white">키미노 나마에와</p>
            <div class="space-x-1 text-sm font-medium">
              <span class="text-green-500">200% 일치</span>
              <span class="text-white">2026</span>
              <span
                class="inline-block rounded-sm border px-1 py-0.5 text-xs text-white"
                >UHD</span
              >
            </div>
            <q class="break-keep text-white"
              >소중한 사람, 잊고 싶지 않은 사람, 잊으면 안 되는 사람!</q
            >
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
