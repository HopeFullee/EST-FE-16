<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
    <style>
      h1,
      h2,
      p {
        margin-bottom: 0;
        line-height: 1;
        word-break: keep-all;
      }

      ul {
        padding: 0;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main class="container py-5">
      <section class="border rounded-4 p-4 p-md-5">
        <div class="row align-items-center g-5">
          <div class="col-12 col-lg-7">
            <div class="d-flex flex-column gap-3 border-bottom border-2 pb-4">
              <div class="d-flex align-items-center gap-2">
                <span class="badge text-bg-success">신청 가능</span>
                <p class="text-secondary">Frontend Study #03</p>
              </div>
              <h1 class="fw-bold">Bootstrap 실전 스터디</h1>
              <p class="fw-medium text-secondary lh-base">
                Bootstrap의 Grid, Utility, Component를 활용해 반응형 웹 UI를
                함께 제작하는 오프라인 스터디입니다.
              </p>
            </div>
            <ul class="d-flex flex-column">
              <li
                class="border-bottom boder-2 py-3 d-flex justify-content-between fw-semibold"
              >
                <span class="text-secondary">일정</span>
                <p>9월 12일 토요일 14:00</p>
              </li>
              <li
                class="border-bottom boder-2 py-3 d-flex justify-content-between fw-semibold"
              >
                <span class="text-secondary">장소</span>
                <p>강남 스터디룸 A</p>
              </li>
              <li
                class="border-bottom boder-2 py-3 d-flex justify-content-between fw-semibold"
              >
                <span class="text-secondary">진행 시간</span>
                <p>약 2시간</p>
              </li>
            </ul>
            <ul class="mt-4">
              <li class="badge rounded-pill text-bg-light border px-3 py-2">
                Grid
              </li>
              <li class="badge rounded-pill text-bg-light border px-3 py-2">
                Utility
              </li>
              <li class="badge rounded-pill text-bg-light border px-3 py-2">
                Responsive
              </li>
            </ul>
          </div>

          <div
            class="h-auto col-12 col-lg-5 p-4 bg-light d-flex flex-column gap-4 rounded-4"
          >
            <div class="d-flex flex-column gap-2">
              <p class="text-secondary fw-semibold">현재 신청 인원</p>
              <p
                class="d-flex justify-content-between align-items-end fw-bold fs-1"
              >
                18명 <span class="text-secondary fs-6">/24명</span>
              </p>
            </div>
            <div
              class="progress"
              role="progressbar"
              aria-label="Basic example"
              aria-valuenow="75"
              aria-valuemin="0"
              aria-valuemax="100"
            >
              <div class="progress-bar w-75">75%</div>
            </div>
            <div
              class="bg-warning bg-opacity-25 border border-warning p-4 rounded-3"
            >
              <p>남은 자리가 많지 않습니다.</p>
            </div>
            <button type="button" class="btn bg-black text-white fs-5">
              스터디 참가 신청
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
